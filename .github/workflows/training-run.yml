name: Pure Software Training Run

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Run duration in minutes (100-200)'
        required: true
        default: '150'
        type: string
      stage:
        description: 'Training stage'
        required: true
        default: '1'
        type: string

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Premium Data Collection + Training
        env:
          DURATION_MINUTES: ${{ github.event.inputs.duration_minutes }}
          STAGE: ${{ github.event.inputs.stage }}
        run: |
          python -m code.run_training
